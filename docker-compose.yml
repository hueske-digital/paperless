services:
  broker:
    image: redis:alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    networks:
      app_cache:

  db:
    image: pgautoupgrade/pgautoupgrade:latest
    restart: unless-stopped
    volumes:
      - db_data:/var/lib/postgresql
    environment:
      POSTGRES_DB: paperless
      POSTGRES_USER: paperless
      POSTGRES_PASSWORD: paperless
    networks:
      app_database:
    labels:
      ofelia.restart: "true"
      ofelia.enabled: "true"
      ofelia.job-exec.paperlessdbbackup.schedule: "0 0 1 * * *"
      ofelia.job-exec.paperlessdbbackup.command: "sh -c 'pg_dumpall -U paperless -f /var/lib/postgresql/backup.sql'"

  app:
    image: ghcr.io/paperless-ngx/paperless-ngx:latest
    restart: unless-stopped
    depends_on:
      - db
      - broker
      - gotenberg
      - tika
      - sftp
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000"]
      interval: 30s
      timeout: 10s
      retries: 5
    volumes:
      - app_data:/usr/src/paperless/data
      - app_media:/usr/src/paperless/media
      - app_export:/usr/src/paperless/export
      - sftp_data:/usr/src/paperless/consume
      - $PWD/scripts:/usr/local/bin/scripts
    environment:
      - PAPERLESS_REDIS=redis://broker:6379
      - PAPERLESS_DBHOST=db
      - PAPERLESS_TIKA_ENABLED=1
      - PAPERLESS_TIKA_GOTENBERG_ENDPOINT=http://gotenberg:3000
      - PAPERLESS_TIKA_ENDPOINT=http://tika:9998
      - PAPERLESS_ENABLE_UPDATE_CHECK=true
      - PAPERLESS_SECRET_KEY
      - PAPERLESS_FILENAME_FORMAT
      - PAPERLESS_URL
      - PAPERLESS_CONSUMER_ENABLE_BARCODES
      - PAPERLESS_EMAIL_TASK_CRON=${PAPERLESS_EMAIL_TASK_CRON:-*/2 * * * *}
      - PAPERLESS_TRAIN_TASK_CRON=${PAPERLESS_TRAIN_TASK_CRON:-*/15 * * * *}
      - PAPERLESS_INDEX_TASK_CRON=${PAPERLESS_INDEX_TASK_CRON:-0 * * * *}
      - PAPERLESS_TASK_WORKERS=${PAPERLESS_TASK_WORKERS:-2}
      - PAPERLESS_THREADS_PER_WORKER=${PAPERLESS_THREADS_PER_WORKER:-3}
      - PAPERLESS_TIMEZONE=${PAPERLESS_TIME_ZONE}
      - TIME_ZONE=${PAPERLESS_TIME_ZONE}
      - PAPERLESS_TIME_ZONE=Europe/Berlin
      - PAPERLESS_FILENAME_FORMAT_REMOVE_NONE=true
      - PAPERLESS_DECRYPT_PASSWORD
      - PAPERLESS_PRE_CONSUME_SCRIPT=/usr/local/bin/scripts/decrypt-pdf
      # Abgeschaltet: paperless-gpt vergibt die Titel jetzt automatisch.
      # Beide gleichzeitig wuerden sich beim Titel widersprechen.
      # - PAPERLESS_POST_CONSUME_SCRIPT=/usr/local/bin/scripts/post-consume
      - KI_EMPFAENGER
      - CADDY_DOMAIN=${CADDY_DOMAIN}
      - CADDY_TYPE=${CADDY_TYPE:-internal}
      - CADDY_PORT=${CADDY_PORT:-8000}
    networks:
      default:
      app_database:
      app_cache:
      caddy:

  gpt:
    image: icereed/paperless-gpt:latest
    restart: unless-stopped
    depends_on:
      - app
    volumes:
      - gpt_prompts:/app/prompts
    environment:
      - PAPERLESS_BASE_URL=http://app:8000
      - PAPERLESS_API_TOKEN=${GPT_PAPERLESS_TOKEN}
      - PAPERLESS_PUBLIC_URL=${PAPERLESS_URL}
      # OpenAI-kompatibler Endpunkt, kein OpenAI - siehe OPENAI_BASE_URL
      - LLM_PROVIDER=openai
      - LLM_MODEL=${GPT_LLM_MODEL}
      - OPENAI_API_KEY=${GPT_LLM_API_KEY}
      - OPENAI_BASE_URL=${GPT_LLM_ENDPOINT}
      - LLM_LANGUAGE=German
      # Ohne Rueckfrage nur Titel und Typ. Der Typ ist laut Doku auf die
      # vorhandenen Typen beschraenkt. Absender und Tags bleiben beim
      # Klassifikator - paperless-gpt wuerde neue Absender anlegen.
      - AUTO_GENERATE_TITLE=true
      - AUTO_GENERATE_DOCUMENT_TYPE=true
      - AUTO_GENERATE_TAGS=false
      - AUTO_GENERATE_CORRESPONDENTS=false
      - AUTO_GENERATE_CREATED_DATE=false
      # Der Endpunkt drosselt frueh; Standard waere 120.
      - LLM_REQUESTS_PER_MINUTE=${GPT_LLM_RPM:-20}
      - SUGGESTION_WORKERS=1
      - LOG_LEVEL=info
      - CADDY_DOMAIN=${GPT_CADDY_DOMAIN}
      - CADDY_TYPE=${GPT_CADDY_TYPE:-internal}
      - CADDY_PORT=8080
    networks:
      default:
      caddy:

  sftp:
    image: ghcr.io/hueske-digital/sftp:latest
    restart: unless-stopped
    volumes:
      - sftp_keys:/etc/ssh
      - sftp_data:/home/${SFTP_USERNAME}/documents
      - $PWD/publickeys:/home/${SFTP_USERNAME}/.ssh/keys:ro
    ports:
      - "2222:22"
    networks:
      sftp:
    command: ${SFTP_USERNAME}:${SFTP_PASSWORD}:1000
    ulimits:
      nofile:
        soft: 65536
        hard: 65536

  gotenberg:
    image: gotenberg/gotenberg:latest
    restart: unless-stopped
    command:
      - "gotenberg"
      - "--chromium-disable-javascript=true"
      - "--chromium-allow-list=file:///tmp/.*"
      - "--chromium-disable-routes=true"
    networks:
      default:

  tika:
    image: apache/tika
    restart: unless-stopped
    networks:
      default:

networks:
  app_database:
  app_cache:
  sftp:
  caddy:

volumes:
  app_data:
  gpt_prompts:
  app_media:
  db_data:
  redis_data:
  sftp_data:
  sftp_keys:
  app_export:
